<div class="ag-theme-alpine" style="height: 500px; width: 800px; margin: auto;">
  <h1 class="text-center text-xl font-bold mb-4">Ag Grid Summary</h1>
  <ag-grid-angular
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [autoGroupColumnDef]="autoGroupColumnDef"
    [groupDisplayType]="'singleColumn'"
    class="ag-theme-alpine"
    style="width: 100%; height: 100%;">
  </ag-grid-angular>
</div>
