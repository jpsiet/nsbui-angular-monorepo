<div class="grid-cont">
  <h1> Ag Grid Responsive Grid</h1>
  <div style="height: 100%; display: flex; flex-direction: column; background-color: red;">
    <div style="margin-bottom: 5px;">
        <button (click)="fillLarge()">Fill 100%</button>
        <button (click)="fillMedium()">Fill 60%</button>
        <button (click)="fillExact()">Exactly 400 x 400 pixels</button>
    </div>
    <div [ngStyle]="style">
        <ag-grid-angular
            style="width: 100%; height:100%;"
            #agGrid
            [rowData]="rowData"
            [columnDefs]="columnDefs"
        />
    </div>
  </div>
</div>
